<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz di Cultura Generale</title>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --correct-color: #28a745;
            --wrong-color: #dc3545;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            padding: 30px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1,
        h2 {
            text-align: center;
            margin-top: 0;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 15px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .progress {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            text-align: right;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 15px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #e2e6ea;
            border-color: #dae0e5;
        }

        .option-btn.correct {
            background-color: #d4edda;
            border-color: var(--correct-color);
            color: #155724;
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #f8d7da;
            border-color: var(--wrong-color);
            color: #721c24;
        }

        .option-btn[disabled] {
            cursor: default;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            min-height: 24px;
        }

        .score-display {
            font-size: 24px;
            text-align: center;
            margin: 15px 0 5px 0;
            font-weight: bold;
        }

        .evaluation-display {
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--primary-color);
            padding: 10px;
            border-radius: 8px;
            background-color: #e9f2ff;
        }

        .review-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .review-item {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .review-item.correct-item {
            border-left: 4px solid var(--correct-color);
            padding-left: 10px;
        }

        .review-item.wrong-item {
            border-left: 4px solid var(--wrong-color);
            padding-left: 10px;
        }

        .bank-info {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 12px;
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <!-- SCHERMATA INIZIALE -->
    <div id="start-screen" class="screen active">
        <h1>Quiz di Cultura Generale</h1>

        <p style="text-align: center; color: #666;">
            Metti alla prova le tue conoscenze!
            Rispondi a 10 domande estratte casualmente.
        </p>

        <button class="btn" onclick="startQuiz()">
            Inizia il Quiz
        </button>

        <div class="bank-info">
            Caricamento domande...
        </div>
        
        <!-- Aggiunto contatore domande fatte -->
        <div id="stats-info" style="text-align: center; color: #007bff; font-weight: bold; font-size: 14px; margin-top: 5px;">
        </div>
        
        <button class="btn" onclick="resetQuizMemory()" style="background-color: #6c757d; margin-top: 10px; font-size: 14px;">
            Azzera memoria (Ricomincia da capo)
        </button>
    </div>


    <!-- SCHERMATA QUIZ -->
    <div id="quiz-screen" class="screen">

        <div class="progress" id="progress">
            Domanda 1 di 10
        </div>

        <div class="question-text" id="question-text">
            Testo della domanda...
        </div>

        <div class="options-container" id="options-container">
        </div>

        <div class="feedback" id="feedback"></div>

        <button
            class="btn"
            id="next-btn"
            style="display: none;"
            onclick="nextQuestion()">
            Prossima Domanda
        </button>

    </div>


    <!-- SCHERMATA RISULTATO -->
    <div id="result-screen" class="screen">

        <h2>Quiz Completato!</h2>

        <div class="score-display" id="score-display">
            Il tuo punteggio: 0 / 10
        </div>

        <div class="evaluation-display" id="evaluation-display">
            Giudizio...
        </div>

        <div id="review-container" class="review-list">
        </div>

        <button class="btn" onclick="startQuiz()">
            Prossime 10 Domande
        </button>
        
        <button class="btn" onclick="goToStart()" style="background-color: #6c757d; margin-top: 10px;">
            Torna alla Home
        </button>

    </div>

</div>

/* ============================================================
   CARICAMENTO DELLE DOMANDE ORIGINALI
   ============================================================ */

const ORIGINAL_QUESTION_URL = "https://raw.githubusercontent.com/GiulioVar1988/quiz-cultura-generale/main/index.html";

let questionBank = [];
let shuffledBank = []; // Qui conserveremo l'array misto globale

let selectedQuestions = [];
let currentQuestionIndex = 0;
let score = 0;
let userAnswers = [];

// Usiamo un indice globale invece di un Set per scorrere l'array misto
let globalQuestionIndex = 0; 

/* ============================================================
   ESTRAZIONE DEL QUESTION BANK DAL VECCHIO INDEX
   ============================================================ */

async function loadOriginalQuestions() {
    try {
        const response = await fetch(ORIGINAL_QUESTION_URL);

        if (!response.ok) {
            throw new Error("Impossibile caricare il question bank originale.");
        }

        const html = await response.text();

        const match = html.match(/const\s+questionBank\s*=\s*(\[[\s\S]*?\]);/);

        if (!match) {
            throw new Error("Question bank originale non trovato.");
        }

        const originalQuestions = Function(`"use strict"; return (${match[1]});`)();

        if (!Array.isArray(originalQuestions)) {
            throw new Error("Il question bank originale non è valido.");
        }

        // Uniamo le domande originali con quelle nuove
        questionBank = [...originalQuestions, ...difficultQuestions];

        // Rimuove eventuali duplicati
        const uniqueQuestions = [];
        const seen = new Set();

        questionBank.forEach(question => {
            if (question && typeof question.q === "string" && Array.isArray(question.options) && question.options.length === 4 && Number.isInteger(question.answer) && question.answer >= 0 && question.answer <= 3) {
                if (!seen.has(question.q)) {
                    seen.add(question.q);
                    uniqueQuestions.push(question);
                }
            }
        });

        questionBank = uniqueQuestions;

        // Carica lo stato dal salvataggio
        loadQuizState();

        updateBankInfo();

    } catch (error) {
        console.error(error);
        questionBank = [...difficultQuestions];
        
        loadQuizState(); // Prova comunque a caricare lo stato per le difficultQuestions
        
        updateBankInfo();
        
        // Se c'è un errore, lo mostriamo ma permettiamo di giocare con le domande "difficult"
        document.querySelector(".bank-info").innerHTML += "<br><span style='color:red;'>Avviso: Caricate solo le domande bonus.</span>";
    }
}

/* ============================================================
   MEMORIA ANTI-RIPETIZIONE (NUOVA LOGICA)
   ============================================================ */

function loadQuizState() {
    try {
        const savedIndex = localStorage.getItem("quizGlobalIndex");
        const savedBank = localStorage.getItem("quizShuffledBank");

        if (savedBank && savedIndex) {
            // Se esiste un salvataggio, ripristiniamo l'array misto e a che punto eravamo
            shuffledBank = JSON.parse(savedBank);
            globalQuestionIndex = parseInt(savedIndex, 10);
            
            // Controllo di sicurezza: se per qualche motivo il db è cambiato e l'indice è sballato
            if (globalQuestionIndex >= shuffledBank.length) {
                resetQuizMemory();
            }
        } else {
            // Primo avvio in assoluto: mischiamo tutto il mazzo
            shuffledBank = shuffleArray([...questionBank]);
            globalQuestionIndex = 0;
            saveQuizState();
        }
    } catch (error) {
        console.warn("Impossibile leggere lo stato del quiz.", error);
        shuffledBank = shuffleArray([...questionBank]);
        globalQuestionIndex = 0;
    }
}

function saveQuizState() {
    try {
        localStorage.setItem("quizShuffledBank", JSON.stringify(shuffledBank));
        localStorage.setItem("quizGlobalIndex", globalQuestionIndex.toString());
    } catch (error) {
        console.warn("Impossibile salvare lo stato del quiz.", error);
    }
}

function resetQuizMemory() {
    localStorage.removeItem("quizShuffledBank");
    localStorage.removeItem("quizGlobalIndex");
    
    // Rimescola da capo
    shuffledBank = shuffleArray([...questionBank]);
    globalQuestionIndex = 0;
    saveQuizState();
    
    updateBankInfo();
    alert("Memoria azzerata! Ripartirai dalla prima domanda di un nuovo mazzo mischiato.");
}

/* ============================================================
   AGGIORNAMENTO NUMERO DOMANDE
   ============================================================ */

function updateBankInfo() {
    const info = document.querySelector(".bank-info");
    const statsInfo = document.getElementById("stats-info");

    if (!info || !questionBank.length) {
        return;
    }

    info.innerText = `${questionBank.length} domande disponibili • 10 domande per partita`;
    
    if (shuffledBank.length > 0) {
        statsInfo.innerText = `Hai visto ${globalQuestionIndex} domande su ${shuffledBank.length}`;
    }
}


/* ============================================================
   SHUFFLE CORRETTO
   ============================================================ */

function shuffleArray(array) {
    const result = [...array];
    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
}


/* ============================================================
   SELEZIONE DI 10 DOMANDE SENZA RIPETIZIONI (NUOVA LOGICA)
   ============================================================ */

function getNextQuestions(n) {
    if (!shuffledBank.length) return [];

    let selected = [];

    // Se l'indice sta per superare il totale delle domande, ricominciamo il giro
    if (globalQuestionIndex + n > shuffledBank.length) {
        // Prendi quelle rimanenti in fondo alla lista
        const remaining = shuffledBank.slice(globalQuestionIndex);
        selected = [...remaining];
        
        // Rimescola per il nuovo giro
        shuffledBank = shuffleArray([...questionBank]);
        globalQuestionIndex = 0;
        
        // Prendi quelle che mancano per arrivare a 10 dal nuovo mazzo
        const needed = n - remaining.length;
        selected = [...selected, ...shuffledBank.slice(0, needed)];
        globalQuestionIndex = needed;
        
        alert("Hai completato tutte le domande del database! Il mazzo è stato rimescolato per un nuovo giro.");
    } else {
        // Estrazione standard e sequenziale dal mazzo mischiato
        selected = shuffledBank.slice(globalQuestionIndex, globalQuestionIndex + n);
        globalQuestionIndex += n;
    }

    saveQuizState();
    return selected;
}


/* ============================================================
   AVVIO QUIZ
   ============================================================ */

function startQuiz() {
    if (!questionBank.length) {
        alert("La banca dati non è ancora pronta. Riprova tra un momento.");
        return;
    }

    selectedQuestions = getNextQuestions(TOTAL_QUESTIONS);

    if (selectedQuestions.length < TOTAL_QUESTIONS) {
        alert("Si è verificato un errore nel caricamento delle domande.");
        return;
    }

    currentQuestionIndex = 0;
    score = 0;
    userAnswers = [];

    showScreen("quiz-screen");
    showQuestion();
}


/* ============================================================
   CAMBIO SCHERMATA
   ============================================================ */

function showScreen(screenId) {
    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
    });
    const screen = document.getElementById(screenId);
    if (screen) {
        screen.classList.add("active");
    }
}

function goToStart() {
    updateBankInfo();
    showScreen("start-screen");
}


/* ============================================================
   MOSTRA DOMANDA
   ============================================================ */

function showQuestion() {
    const qData = selectedQuestions[currentQuestionIndex];
    if (!qData) return;

    document.getElementById("progress").innerText = `Domanda ${currentQuestionIndex + 1} di ${TOTAL_QUESTIONS}`;
    document.getElementById("question-text").innerText = qData.q;

    const feedback = document.getElementById("feedback");
    feedback.innerText = "";
    feedback.style.color = "";

    document.getElementById("next-btn").style.display = "none";

    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    qData.options.forEach((optionText, index) => {
        const button = document.createElement("button");
        button.className = "option-btn";
        button.innerText = optionText;
        button.onclick = () => selectOption(index);
        optionsContainer.appendChild(button);
    });
}


/* ============================================================
   RISPOSTA DELL'UTENTE
   ============================================================ */

function selectOption(selectedIndex) {
    const qData = selectedQuestions[currentQuestionIndex];
    const buttons = document.querySelectorAll(".option-btn");

    buttons.forEach(button => { button.disabled = true; });

    const isCorrect = selectedIndex === qData.answer;

    userAnswers.push({
        question: qData.q,
        selected: qData.options[selectedIndex],
        correct: qData.options[qData.answer],
        isCorrect: isCorrect
    });

    if (isCorrect) {
        score++;
        buttons[selectedIndex].classList.add("correct");
        const feedback = document.getElementById("feedback");
        feedback.innerText = "Corretto! 🎉";
        feedback.style.color = "var(--correct-color)";
    } else {
        buttons[selectedIndex].classList.add("wrong");
        buttons[qData.answer].classList.add("correct");
        const feedback = document.getElementById("feedback");
        feedback.innerText = "Sbagliato! ❌";
        feedback.style.color = "var(--wrong-color)";
    }

    document.getElementById("next-btn").style.display = "block";
}


/* ============================================================
   PROSSIMA DOMANDA
   ============================================================ */

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < TOTAL_QUESTIONS) {
        showQuestion();
    } else {
        showResults();
    }
}


/* ============================================================
   RISULTATO FINALE
   ============================================================ */

function showResults() {
    showScreen("result-screen");

    document.getElementById("score-display").innerText = `Il tuo punteggio: ${score} / ${TOTAL_QUESTIONS}`;

    const evalBox = document.getElementById("evaluation-display");

    if (score <= 2) {
        evalBox.innerText = "Giudizio: Da migliorare! 😅 Continua ad allenarti con la cultura generale.";
        evalBox.style.color = "#dc3545";
        evalBox.style.backgroundColor = "#f8d7da";
    } else if (score <= 4) {
        evalBox.innerText = "Giudizio: Insufficiente! 📚 Serve un bel ripasso.";
        evalBox.style.color = "#dc3545";
        evalBox.style.backgroundColor = "#f8d7da";
    } else if (score <= 6) {
        evalBox.innerText = "Giudizio: Sufficiente / Mediocre! 🙂 Te la cavi, ma puoi fare di meglio.";
        evalBox.style.color = "#856404";
        evalBox.style.backgroundColor = "#fff3cd";
    } else if (score <= 8) {
        evalBox.innerText = "Giudizio: Bravo! 👏 Ottima conoscenza di cultura generale!";
        evalBox.style.color = "#004085";
        evalBox.style.backgroundColor = "#cce5ff";
    } else {
        evalBox.innerText = "Giudizio: Complimenti! 🏆 Un vero esperto di cultura generale!";
        evalBox.style.color = "#155724";
        evalBox.style.backgroundColor = "#d4edda";
    }

    const reviewContainer = document.getElementById("review-container");
    reviewContainer.innerHTML = "<h3>Riepilogo Risposte:</h3>";

    userAnswers.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = `review-item ${item.isCorrect ? "correct-item" : "wrong-item"}`;

        let content = `<strong>${index + 1}. ${escapeHtml(item.question)}</strong><br>`;

        if (item.isCorrect) {
            content += `<span style="color: var(--correct-color)">Risposta: ${escapeHtml(item.selected)} ✔</span>`;
        } else {
            content += `<span style="color: var(--wrong-color)">Tua risposta: ${escapeHtml(item.selected)} ✖</span><br>`;
            content += `<span style="color: var(--correct-color)">Risposta corretta: ${escapeHtml(item.correct)}</span>`;
        }

        div.innerHTML = content;
        reviewContainer.appendChild(div);
    });
}


/* ============================================================
   SICUREZZA HTML
   ============================================================ */

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value;
    return div.innerHTML;
}

/* ============================================================
   AVVIO CARICAMENTO BANCA DATI
   ============================================================ */

loadOriginalQuestions();

</script>
