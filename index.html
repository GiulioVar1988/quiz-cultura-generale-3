<!DOCTYPE html>
<html lang="it">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz di Cultura Generale</title>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --correct-color: #28a745;
            --wrong-color: #dc3545;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            padding: 30px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1,
        h2 {
            text-align: center;
            margin-top: 0;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 15px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .progress {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            text-align: right;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 15px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #e2e6ea;
            border-color: #dae0e5;
        }

        .option-btn.correct {
            background-color: #d4edda;
            border-color: var(--correct-color);
            color: #155724;
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #f8d7da;
            border-color: var(--wrong-color);
            color: #721c24;
        }

        .option-btn[disabled] {
            cursor: default;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            min-height: 24px;
        }

        .score-display {
            font-size: 24px;
            text-align: center;
            margin: 15px 0 5px 0;
            font-weight: bold;
        }

        .evaluation-display {
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--primary-color);
            padding: 10px;
            border-radius: 8px;
            background-color: #e9f2ff;
        }

        .review-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .review-item {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .review-item.correct-item {
            border-left: 4px solid var(--correct-color);
            padding-left: 10px;
        }

        .review-item.wrong-item {
            border-left: 4px solid var(--wrong-color);
            padding-left: 10px;
        }

        .bank-info {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 12px;
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <!-- SCHERMATA INIZIALE -->

        </button>

            240+ domande disponibili • 10 domande per partita
        </div>
    </div>


    <!-- SCHERMATA QUIZ -->
    <div id="quiz-screen" class="screen">

        <div class="progress" id="progress">
            Domanda 1 di 10
        </div>

        <div class="question-text" id="question-text">
            Testo della domanda...
        </div>

        <div class="options-container" id="options-container">
        </div>

        <div class="feedback" id="feedback"></div>

        <button

            id="next-btn"
            style="display: none;"
            onclick="nextQuestion()">

    </div>

        <div class="score-display" id="score-display">

        </div>

        <div class="evaluation-display" id="evaluation-display">
            Giudizio...
        </div>

        <div id="review-container" class="review-list">
        </div>

        <button class="btn" onclick="startQuiz()">
            Ricomincia Nuovo Quiz
        </button>

    </div>

</div>

/* ============================================================
   CARICAMENTO DELLE DOMANDE ORIGINALI
   ============================================================

   Il file originale del tuo progetto viene letto direttamente
   dal repository principale.

   In questo modo le tue domande originali rimangono intatte.
   ============================================================ */

const ORIGINAL_QUESTION_URL =
    "https://raw.githubusercontent.com/GiulioVar1988/quiz-cultura-generale/main/index.html";


let questionBank = [];

let selectedQuestions = [];
let currentQuestionIndex = 0;
let score = 0;
let userAnswers = [];

/*
   Contiene il testo delle domande già utilizzate.
   Finché non vengono utilizzate tutte, non possono essere
   estratte nuovamente.
*/
let usedQuestions = new Set();


/* ============================================================
   ESTRAZIONE DEL QUESTION BANK DAL VECCHIO INDEX
   ============================================================ */

async function loadOriginalQuestions() {

    try {

        const response = await fetch(ORIGINAL_QUESTION_URL);

        if (!response.ok) {
            throw new Error("Impossibile caricare il question bank originale.");
        }

        const html = await response.text();

        /*
           Cerca la parte:

           const questionBank = [
               ...
           ];

           e la converte in un array JavaScript.
        */

        const match = html.match(
            /const\s+questionBank\s*=\s*(\[[\s\S]*?\]);/
        );

        if (!match) {
            throw new Error("Question bank originale non trovato.");
        }

        /*
           Il question bank originale contiene solamente oggetti
           di questo tipo:

           { q: "...", options: [...], answer: 1 }

           Per sicurezza utilizziamo Function soltanto sul blocco
           già proveniente dal nostro repository.
        */

        const originalQuestions = Function(
            `"use strict"; return (${match[1]});`
        )();

        if (!Array.isArray(originalQuestions)) {
            throw new Error("Il question bank originale non è valido.");
        }

        /*
           Uniamo le domande originali con quelle nuove.
        */
        questionBank = [
            ...originalQuestions,
            ...difficultQuestions
        ];

        /*
           Rimuove eventuali duplicati in base al testo della domanda.
        */
        const uniqueQuestions = [];
        const seen = new Set();

        questionBank.forEach(question => {

            if (
                question &&
                typeof question.q === "string" &&
                Array.isArray(question.options) &&
                question.options.length === 4 &&
                Number.isInteger(question.answer) &&
                question.answer >= 0 &&
                question.answer <= 3
            ) {

                if (!seen.has(question.q)) {
                    seen.add(question.q);
                    uniqueQuestions.push(question);
                }

            }

        });

        questionBank = uniqueQuestions;

        console.log(
            "Domande originali:",
            originalQuestions.length
        );

        console.log(
            "Domande nuove:",
            difficultQuestions.length
        );

        console.log(
            "Domande totali:",
            questionBank.length
        );

        /*
           Se il browser ha già una banca memorizzata,
           la carichiamo per continuare il ciclo.
        */
        loadUsedQuestions();

        /*
           Aggiorna il numero visualizzato.
        */
        updateBankInfo();

    } catch (error) {

        console.error(error);

        /*
           Se per qualche motivo il repository originale non
           fosse raggiungibile, utilizziamo comunque le nuove
           domande per evitare una pagina completamente vuota.
        */
        questionBank = [...difficultQuestions];

        updateBankInfo();

        document.getElementById("start-screen").innerHTML = `
            <h1>Quiz di Cultura Generale</h1>

            <p style="text-align:center;color:#666;">
                Il caricamento della banca dati originale ha avuto
                un problema temporaneo.
            </p>

            <button class="btn" onclick="location.reload()">
                Riprova
            </button>
        `;
    }
}


/* ============================================================
   MEMORIA ANTI-RIPETIZIONE
   ============================================================ */

function loadUsedQuestions() {

    try {

        const saved = localStorage.getItem(
            "quizCulturaGeneraleUsedQuestions"
        );

        if (!saved) {
            usedQuestions = new Set();
            return;
        }

        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {
            usedQuestions = new Set(parsed);
        }

    } catch (error) {

        console.warn(
            "Impossibile leggere le domande utilizzate.",
            error
        );

        usedQuestions = new Set();
    }
}


function saveUsedQuestions() {

    try {

        localStorage.setItem(
            "quizCulturaGeneraleUsedQuestions",
            JSON.stringify([...usedQuestions])
        );

    } catch (error) {

        console.warn(
            "Impossibile salvare le domande utilizzate.",
            error
        );
    }
}


/* ============================================================
   AGGIORNAMENTO NUMERO DOMANDE
   ============================================================ */

function updateBankInfo() {

    const info = document.querySelector(".bank-info");

    if (!info || !questionBank.length) {
        return;
    }

    info.innerText =
        `${questionBank.length} domande disponibili • 10 domande per partita`;
}


/* ============================================================
   SHUFFLE CORRETTO
   ============================================================ */

function shuffleArray(array) {

    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {

        const j = Math.floor(
            Math.random() * (i + 1)
        );

        [result[i], result[j]] =
            [result[j], result[i]];
    }

    return result;
}


/* ============================================================
   SELEZIONE DI 10 DOMANDE SENZA RIPETIZIONI
   ============================================================ */

function getRandomQuestions(array, n) {

    if (!array.length) {
        return [];
    }

    /*
       Domande ancora non utilizzate.
    */
    let availableQuestions = array.filter(
        question => !usedQuestions.has(question.q)
    );

    /*
       Se non ci sono abbastanza domande per completare
       una partita da 10, terminiamo il vecchio ciclo
       e iniziamo un nuovo ciclo.
    */
    if (availableQuestions.length < n) {

        usedQuestions.clear();
        saveUsedQuestions();

        availableQuestions = [...array];
    }

    /*
       Mischiamo veramente tutta la banca disponibile.
    */
    const shuffled = shuffleArray(
        availableQuestions
    );

    const selected = shuffled.slice(0, n);

    /*
       Memorizziamo immediatamente le domande utilizzate.
    */
    selected.forEach(question => {
        usedQuestions.add(question.q);
    });

    saveUsedQuestions();

    return selected;
}


/* ============================================================
   AVVIO QUIZ
   ============================================================ */

function startQuiz() {

    if (!questionBank.length) {

        alert(
            "La banca dati non è ancora pronta. Riprova tra un momento."
        );

        return;
    }

    selectedQuestions = getRandomQuestions(
        questionBank,
        TOTAL_QUESTIONS
    );

    if (selectedQuestions.length < TOTAL_QUESTIONS) {

        alert(
            "Non sono disponibili abbastanza domande."
        );

        return;
    }

    currentQuestionIndex = 0;
    score = 0;
    userAnswers = [];

    showScreen("quiz-screen");

    showQuestion();
}


/* ============================================================
   CAMBIO SCHERMATA
   ============================================================ */

function showScreen(screenId) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {
            screen.classList.remove("active");
        });

    const screen =
        document.getElementById(screenId);

    if (screen) {
        screen.classList.add("active");
    }
}


/* ============================================================
   MOSTRA DOMANDA
   ============================================================ */

function showQuestion() {

    const qData =
        selectedQuestions[currentQuestionIndex];

    if (!qData) {
        return;
    }

    document.getElementById("progress").innerText =
        `Domanda ${currentQuestionIndex + 1} di ${TOTAL_QUESTIONS}`;

    document.getElementById("question-text").innerText =
        qData.q;

    const feedback =
        document.getElementById("feedback");

    feedback.innerText = "";
    feedback.style.color = "";

    document.getElementById("next-btn").style.display =
        "none";

    const optionsContainer =
        document.getElementById("options-container");

    optionsContainer.innerHTML = "";

    /*
       Mescoliamo anche le quattro risposte?

       NO.

       Manteniamo le risposte nella loro posizione perché
       il campo answer del database indica l'indice corretto.
    */

    qData.options.forEach((optionText, index) => {

        const button =
            document.createElement("button");

        button.className = "option-btn";

        button.innerText =
            optionText;

        button.onclick =
            () => selectOption(index);

        optionsContainer.appendChild(button);
    });
}


/* ============================================================
   RISPOSTA DELL'UTENTE
   ============================================================ */

function selectOption(selectedIndex) {

    const qData =
        selectedQuestions[currentQuestionIndex];

    const buttons =
        document.querySelectorAll(".option-btn");

    /*
       Evita che l'utente possa rispondere due volte.
    */
    buttons.forEach(button => {
        button.disabled = true;
    });

    const isCorrect =
        selectedIndex === qData.answer;

    /*
       Salva la risposta per il riepilogo finale.
    */
    userAnswers.push({

        question: qData.q,

        selected:
            qData.options[selectedIndex],

        correct:
            qData.options[qData.answer],

        isCorrect:
            isCorrect

    });

    /*
       RISPOSTA CORRETTA
    */
    if (isCorrect) {

        score++;

        buttons[selectedIndex]
            .classList.add("correct");

        const feedback =
            document.getElementById("feedback");

        feedback.innerText =
            "Corretto! 🎉";

        feedback.style.color =
            "var(--correct-color)";
    }

    /*
       RISPOSTA SBAGLIATA
    */
    else {

        buttons[selectedIndex]
            .classList.add("wrong");

        buttons[qData.answer]
            .classList.add("correct");

        const feedback =
            document.getElementById("feedback");

        feedback.innerText =
            "Sbagliato! ❌";

        feedback.style.color =
            "var(--wrong-color)";
    }

    /*
       Mostra il pulsante per andare avanti.
    */
    document.getElementById("next-btn")
        .style.display = "block";
}


/* ============================================================
   PROSSIMA DOMANDA
   ============================================================ */

function nextQuestion() {

    currentQuestionIndex++;

    if (
        currentQuestionIndex <
        TOTAL_QUESTIONS
    ) {

        showQuestion();

    } else {

        showResults();
    }
}


/* ============================================================
   RISULTATO FINALE
   ============================================================ */

function showResults() {

    showScreen("result-screen");

    document.getElementById(
        "score-display"
    ).innerText =
        `Il tuo punteggio: ${score} / ${TOTAL_QUESTIONS}`;


    const evalBox =
        document.getElementById(
            "evaluation-display"
        );


    if (score <= 2) {

        evalBox.innerText =
            "Giudizio: Da migliorare! 😅 Continua ad allenarti con la cultura generale.";

        evalBox.style.color =
            "#dc3545";

        evalBox.style.backgroundColor =
            "#f8d7da";
    }

    else if (score <= 4) {

        evalBox.innerText =
            "Giudizio: Insufficiente! 📚 Serve un bel ripasso.";

        evalBox.style.color =
            "#dc3545";

        evalBox.style.backgroundColor =
            "#f8d7da";
    }

    else if (score <= 6) {

        evalBox.innerText =
            "Giudizio: Sufficiente / Mediocre! 🙂 Te la cavi, ma puoi fare di meglio.";

        evalBox.style.color =
            "#856404";

        evalBox.style.backgroundColor =
            "#fff3cd";
    }

    else if (score <= 8) {

        evalBox.innerText =
            "Giudizio: Bravo! 👏 Ottima conoscenza di cultura generale!";

        evalBox.style.color =
            "#004085";

        evalBox.style.backgroundColor =
            "#cce5ff";
    }

    else {

        evalBox.innerText =
            "Giudizio: Complimenti! 🏆 Un vero esperto di cultura generale!";

        evalBox.style.color =
            "#155724";

        evalBox.style.backgroundColor =
            "#d4edda";
    }


    /*
       RIEPILOGO DELLE 10 DOMANDE
    */

    const reviewContainer =
        document.getElementById(
            "review-container"
        );

    reviewContainer.innerHTML =
        "<h3>Riepilogo Risposte:</h3>";


    userAnswers.forEach(
        (item, index) => {

            const div =
                document.createElement("div");

            div.className =
                `review-item ${
                    item.isCorrect
                        ? "correct-item"
                        : "wrong-item"
                }`;


            let content =
                `<strong>${index + 1}. ${escapeHtml(item.question)}</strong><br>`;


            if (item.isCorrect) {

                content +=
                    `<span style="color: var(--correct-color)">
                        Risposta: ${escapeHtml(item.selected)} ✔
                    </span>`;

            } else {

                content +=
                    `<span style="color: var(--wrong-color)">
                        Tua risposta: ${escapeHtml(item.selected)} ✖
                    </span><br>`;

                content +=
                    `<span style="color: var(--correct-color)">
                        Risposta corretta: ${escapeHtml(item.correct)}
                    </span>`;
            }


            div.innerHTML =
                content;

            reviewContainer.appendChild(div);
        }
    );
}


/* ============================================================
   SICUREZZA HTML
   ============================================================ */

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value;

    return div.innerHTML;
}


/* ============================================================
   AVVIO CARICAMENTO BANCA DATI
   ============================================================ */

loadOriginalQuestions();

</script>

</html>
